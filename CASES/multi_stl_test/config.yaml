# ==============================================================================
# TEST CASE: Multi-STL with Rotation
# ==============================================================================
#
# This case tests:
#   1. Loading two different STL files (cube + sphere)
#   2. Static translation (sphere shifted +2m in Y)
#   3. Dynamic rotation (sphere rotating around Z-axis at 5 rad/s)
#   4. Periodic re-voxelization every 20 steps
#
# The cube is static at the origin.
# The sphere is translated in Y and rotates around its own center.
#
# Low resolution + few steps for quick verification.
# ==============================================================================

basic:
  geometries:
    # Part 1: Static cube at the origin
    - stl_file: "cube1m.stl"
      stl_scale: 1.0

    # Part 2: Sphere translated +2m in Y, rotating around Z-axis
    - stl_file: "ball1m.stl"
      stl_scale: 0.5
      translation: [0.0, 2.0, 0.0]
      rotation:
        axis: [0.0, 0.0, 1.0]
        angle: 0.0
        angular_velocity: 5.0
        center: [0.0, 0.0, 0.0]

  remesh_interval: 20

  surface_resolution: 20
  num_levels: 4
  reference_area_of_full_model: 1.0
  reference_chord: 1.0
  reference_length_for_meshing: 1.0
  reference_dimension: "x"

  fluid:
    density: 1.225
    kinematic_viscosity: 1.5e-5

  flow:
    velocity: 10.0

  simulation:
    steps: 100
    ramp_steps: 20
    output_freq: 50
    output_dir: "RESULTS"
    output_fields:
      density: false
      velocity: true
      velocity_magnitude: true
      vorticity: false
      obstacle: true
      level: true
      bouzidi: false

advanced:
  numerics:
    u_lattice: 0.03
    c_wale: 0.50
    tau_min: 0.500001
    tau_safety_factor: 1.0
    inlet_turbulence_intensity: 0.0
    nu_sgs_background: 0.001

  high_re:
    auto_levels: false
    max_levels: 8
    min_coarse_blocks: 4
    wall_model:
      enabled: false
      type: "equilibrium"
      y_plus_target: 100.0
    adaptive_refinement:
      enabled: false
      criterion: "vorticity"
      threshold: 0.1

  domain:
    upstream: 2.0
    downstream: 3.0
    lateral: 3.0
    height: 2.0
    sponge_thickness: 0.10

  refinement:
    block_size: 8
    margin: 1
    strategy: "geometry_first"
    symmetric_analysis: false
    wake_enabled: false
    wake_length: 0.25
    wake_width_factor: 0.1
    wake_height_factor: 0.1

  boundary:
    method: "bouzidi"
    bouzidi_levels: 1
    use_float16_qmap: true
    q_min_threshold: 0.001

  forces:
    enabled: true
    output_freq: 0
    moment_center: [0.25, 0.0, 0.0]

  diagnostics:
    freq: 20
    stability_check: true
    print_tau_warning: true

  gpu:
    async_depth: 4
    use_streams: true
    prefetch_neighbors: true
