# ==============================================================================
# TEST CASE: Multi-STL with Dynamic Rotation
# ==============================================================================
#
# This case tests:
#   1. Loading two different STL files (cube + sphere)
#   2. Dynamic rotation: the CUBE rotates around Z-axis at 2 rad/s
#      (cube has corners → rotation is clearly visible in VTK output)
#   3. Static sphere as reference body
#   4. Re-voxelization every 10 steps updates obstacle + Bouzidi
#
# Open the VTK outputs (step 50 vs 100) in ParaView to verify the
# cube has rotated between frames.
#
# Low resolution + few steps for quick verification.
# ==============================================================================

basic:
  geometries:
    # Part 1: Cube rotating around Z-axis (clearly visible due to corners)
    - stl_file: "cube1m.stl"
      stl_scale: 1.0
      rotation:
        axis: [0.0, 0.0, 1.0]       # Z-axis
        angle: 0.0                    # Start at 0 degrees
        angular_velocity: 2.0         # 2 rad/s (~115 deg/s)
        center: [0.5, 0.5, 0.5]      # Center of the 1m cube

    # Part 2: Static sphere (reference body, no transform)
    - stl_file: "ball1m.stl"
      stl_scale: 0.4
      translation: [0.0, 2.5, 0.0]

  # Re-voxelize every 10 steps to track the rotation
  remesh_interval: 10

  surface_resolution: 20
  num_levels: 4
  reference_area_of_full_model: 1.0
  reference_chord: 1.0
  reference_length_for_meshing: 1.0
  reference_dimension: "x"

  fluid:
    density: 1.225
    kinematic_viscosity: 1.5e-5

  flow:
    velocity: 10.0

  simulation:
    steps: 200
    ramp_steps: 40
    output_freq: 50
    output_dir: "RESULTS"
    output_fields:
      density: false
      velocity: true
      velocity_magnitude: true
      vorticity: false
      obstacle: true
      level: true
      bouzidi: false

advanced:
  numerics:
    u_lattice: 0.03
    c_wale: 0.50
    tau_min: 0.500001
    tau_safety_factor: 1.0
    inlet_turbulence_intensity: 0.0
    nu_sgs_background: 0.001

  high_re:
    auto_levels: false
    max_levels: 8
    min_coarse_blocks: 4
    wall_model:
      enabled: false
      type: "equilibrium"
      y_plus_target: 100.0
    adaptive_refinement:
      enabled: false
      criterion: "vorticity"
      threshold: 0.1

  domain:
    upstream: 2.0
    downstream: 3.0
    lateral: 3.0
    height: 2.0
    sponge_thickness: 0.10

  refinement:
    block_size: 8
    margin: 1
    strategy: "geometry_first"
    symmetric_analysis: false
    wake_enabled: false
    wake_length: 0.25
    wake_width_factor: 0.1
    wake_height_factor: 0.1

  boundary:
    method: "bouzidi"
    bouzidi_levels: 1
    use_float16_qmap: true
    q_min_threshold: 0.001

  forces:
    enabled: true
    output_freq: 0
    moment_center: [0.25, 0.0, 0.0]

  diagnostics:
    freq: 20
    stability_check: true
    print_tau_warning: true

  gpu:
    async_depth: 4
    use_streams: true
    prefetch_neighbors: true
